$filemanager = nemo
$noctalia = qs -c noctalia-shell ipc call
$applauncher = $noctalia launcher toggle
$terminal = alacritty
$webbrowser = zen-browser
$capturing = grim -g "$(slurp)" - | swappy -f -
$screenrecord = $HOME/.config/hypr/scripts/screenrecord
$monitor1 = DP-2
$monitor2 = HDMI-A-4